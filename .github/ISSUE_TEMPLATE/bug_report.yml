name: Bug report
description: Report incorrect behavior with a reproducible example.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include minimal commands and sanitized data only.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and platform
      placeholder: Node 22.16, macOS 15, ContextBridge 0.0.1
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed credentials, tokens, and private project content from this report.
          required: true
